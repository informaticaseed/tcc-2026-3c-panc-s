<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PANC's{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topo">
        <a href="{{ url_for('index') }}" class="logo">PANC's</a>
        <p class="subtitulo">Plantas Alimentícias Não Convencionais</p>
    </header>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape">
        <p>TCC 2026 - Turma 3C - CEMI</p>
    </footer>
</body>
</html>
